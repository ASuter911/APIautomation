name: Run Jest Tests
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
        - cron: '0 0 * * *' # Runs every day at midnight UTC
  workflow_dispatch:

jobs:
  jest-test-for-push:
    strategy:
      matrix:
        node-version: [18, 20]
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: ${ { matrix.node-version } }

      - name: Install npm dependencies
        run: npm install

      - name: Run Jest Tests
        run: npx jest test.spec.ts